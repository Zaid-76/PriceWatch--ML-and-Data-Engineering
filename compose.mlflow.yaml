name: pricewatch-mlflow

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1

    working_dir: /mlflow

    ports:
      - "5000:5000"

    volumes:
      - ./mlflow-data:/mlflow

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
      --serve-artifacts
      --allowed-hosts localhost:5000,127.0.0.1:5000,host.docker.internal:5000,mlflow:5000